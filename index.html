<!DOCTYPE html>
<html>
<head>
    <title>Prediction App</title>
    <style>
        body { font-family: Arial; background:#f7f7f7; padding:40px; }
        .card { width:50%; margin:auto; background:white; padding:20px; border-radius:10px; }
        input { width:100%; padding:10px; margin:10px 0; }
        button { padding:10px 20px; background:black; color:white; border:none; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Prediction App</h1>

        <form action="/predict" method="POST">
            <label>Value 1</label>
            <input type="text" name="val1" required>

            <label>Value 2</label>
            <input type="text" name="val2" required>

            <label>Value 3</label>
            <input type="text" name="val3" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <h3>Prediction: {{ prediction }}</h3>
        {% endif %}
    </div>
</body>
</html>
